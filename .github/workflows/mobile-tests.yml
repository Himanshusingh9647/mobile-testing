name: Mobile Web Tests CI

# ─────────────────────────────────────────────────────────
#  Trigger: runs on every push / PR to main
# ─────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Mobile Web Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      # ── 1. Checkout the repository ──
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # ── 3. Install dependencies ──
      - name: Install dependencies
        run: npm ci

      # ── 4. Install Chrome for Selenium ──
      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: google-chrome --version

      # ── 5. Run the test suite with report generation ──
      - name: Run tests
        run: npm run test:report
        env:
          CI: true

      # ── 6. Upload test results as artifacts ──
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node${{ matrix.node-version }}
          path: test-results/
          retention-days: 30

      # ── 7. Comment on PR with test summary (PRs only) ──
      - name: Post test summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = './test-results';
            if (!fs.existsSync(dir)) return;

            const files = fs.readdirSync(dir)
              .filter(f => f.endsWith('.json'))
              .sort()
              .reverse();

            if (!files.length) return;

            const report = JSON.parse(fs.readFileSync(path.join(dir, files[0]), 'utf-8'));
            const s = report.summary || {};
            const icon = s.failed > 0 ? '❌' : '✅';

            const body = [
              `## ${icon} Mobile Web Test Results (Node ${process.env.NODE_VERSION || ''})`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| **Total**   | ${s.total || 0} |`,
              `| **Passed**  | ${s.passed || 0} |`,
              `| **Failed**  | ${s.failed || 0} |`,
              `| **Skipped** | ${s.skipped || 0} |`,
              `| **Duration** | ${((s.duration || 0) / 1000).toFixed(2)}s |`,
              '',
              `> Report generated at ${report.endTime || 'N/A'}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
